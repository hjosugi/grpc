spring.application.name=grpc-java
spring.main.web-application-type=none
spring.grpc.server.address=${GRPC_HOST:127.0.0.1}
spring.grpc.server.port=${GRPC_PORT:50052}
spring.grpc.server.inbound.message.max-size=1MB
spring.grpc.server.shutdown.grace-period=5s
spring.grpc.client.channel.shop.target=static://${GRPC_TARGET:localhost:50052}
spring.grpc.client.channel.shop.ssl.enabled=false
demo.fixtures=${FIXTURES_PATH:../fixtures/orders.json}
demo.delay-ms=${DEMO_DELAY_MS:0}
